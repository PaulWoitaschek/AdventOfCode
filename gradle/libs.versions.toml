[versions]
kotlin = "2.4.21"
ktfmt = "0.65"
spotless = "8.11.0"

[libraries]
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version.ref = "ktfmt" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
okhttp = "com.squareup.okhttp3:okhttp:5.5.1"
clikt = "com.github.ajalt.clikt:clikt:5.1.0"
kotlinPoet = "com.squareup:kotlinpoet:2.4.0"

jupiter = "org.junit.jupiter:junit-jupiter:6.1.3"

serialization = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
kotlin-jvmPlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-powerAssertPlugin = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = {id="org.jetbrains.compose", version="1.12.2"}
